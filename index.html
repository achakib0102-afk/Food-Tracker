<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Label Reader</title>
<meta name="theme-color" content="#EDEBE4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Label">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--paper:#EDEBE4;--card:#FFF;--ink:#171A15;--muted:#6E7268;--rule:#CFCCC2;--faint:#EAE8E0;
      --p:#2A6B57;--c:#B0801E;--f:#8A5A3C;--alert:#9E2B12}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:Archivo,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%}
body{padding:max(18px,env(safe-area-inset-top)) 14px calc(64px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
.head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.title{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0}
.ghost{background:none;border:none;color:var(--muted);font:inherit;font-size:13px;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--rule);margin-bottom:16px}
.tab{background:none;border:none;font:inherit;font-size:14px;color:var(--muted);cursor:pointer;
  padding:0 0 9px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.panel{background:var(--card);border:1px solid var(--rule);padding:16px;margin-bottom:12px}
.datebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.datebar .d{font-size:15px;font-weight:600}
.nav{border:1px solid var(--rule);font:inherit;cursor:pointer;padding:5px 12px;color:var(--ink);background:var(--card)}
.nav:disabled{opacity:.35}
.bignum{font-size:42px;font-weight:700;letter-spacing:-.035em;line-height:1}
.bigsub{font-size:13px;color:var(--muted);margin-top:5px}
.bars{margin-top:16px;display:grid;gap:10px}
.barrow{display:grid;grid-template-columns:62px 1fr 84px;align-items:center;gap:10px;font-size:13px}
.track{height:7px;background:var(--faint);overflow:hidden}
.fill{height:100%;display:block}
.amt{text-align:right;color:var(--muted);font-size:12.5px}
.over{color:var(--alert);font-weight:600}
.row{display:flex;gap:8px}
input,select{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--rule);
  background:var(--card);color:var(--ink);width:100%;border-radius:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.btn{font:inherit;font-size:14px;font-weight:600;padding:9px 14px;border:1px solid var(--ink);
  background:var(--ink);color:var(--paper);cursor:pointer;white-space:nowrap;border-radius:0}
.btn.alt{background:var(--card);color:var(--ink)}
.btn.sm{font-size:12.5px;padding:6px 10px;font-weight:500}
.btn:disabled{opacity:.45}
.or{text-align:center;color:var(--muted);font-size:12.5px;margin:10px 0}
.err{border-left:3px solid var(--alert);padding:9px 12px;font-size:13.5px;margin-bottom:12px;background:var(--card)}
.warn{border-left:3px solid var(--c);padding:9px 12px;font-size:13px;margin:11px 0;background:#FBF7EC}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:5px 0;border-bottom:1px solid var(--faint)}
td.sub{padding-left:16px;color:var(--muted);font-size:13px}
td.val{width:96px}
td.val input{padding:4px 6px;font-size:15px;text-align:right}
.unit{color:var(--muted);font-size:12px;width:26px;padding-left:6px}
.bucket{border-top:1px solid var(--rule);padding-top:12px;margin-top:14px}
.bucket.first{border-top:none;padding-top:0;margin-top:0}
.bhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.bname{font-size:14px;font-weight:600}
.bkcal{font-size:13px;color:var(--muted)}
.entry{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  padding:8px 0;border-bottom:1px solid var(--faint);font-size:14px}
.entry-sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px}
.brow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.lab{font-size:12.5px;color:var(--muted);display:block;margin-bottom:5px}
.check{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;margin-top:12px}
.check input{width:auto;margin-top:2px}
.empty{color:var(--muted);font-size:13.5px;padding:12px 0}
.note{font-size:12.5px;color:var(--muted);margin-top:9px;line-height:1.5}
.srch{font-size:12px;color:var(--muted);margin:12px 0 2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow{font-size:11px;color:var(--muted);text-align:center;padding-bottom:5px}
.cell{aspect-ratio:1;border:1px solid var(--faint);background:var(--card);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font:inherit;color:var(--ink);padding:2px}
.cell.blank{border:none;background:none}
.cell.sel{outline:2px solid var(--ink);outline-offset:-2px}
.cell .dn{font-size:12px}
.cell .kc{font-size:10.5px;color:var(--muted)}
.dot{width:70%;height:3px;background:var(--faint)}
.libitem{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:9px 0;border-bottom:1px solid var(--faint);font-size:14px}
.libact{display:flex;gap:6px;align-items:center}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="empty">Loading…</p></div>
<script type="module" src="app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
